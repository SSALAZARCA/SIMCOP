<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIMCOP - Plataforma de Mando y Análisis</title>
  <!-- Meta tags to disable problematic browser features that conflict with standard scripts -->
  <meta name="google" content="notranslate">
  <meta name="msapplication-tap-highlight" content="no">
  <!-- Disable Edge Editor to avoid "A custom element ... has already been defined" errors -->
  <meta name="ms-editor" content="false">

  <script>
    if (typeof global === 'undefined') {
      window.global = window;
    }
    // Diagnostic logging for startup
    console.log("🚀 SIMCOP Index initialized");
  </script>

  <link rel="icon" href="data:,"> <!-- Explicit empty favicon to avoid 504 on fallback -->
  <style>
    html,
    body,
    #root {
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      /* Prevent body scroll when mobile nav is open */
    }

    /* Scrollbar styling for webkit browsers */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #111827;
      /* bg-gray-900 for main content, or sidebar's bg-gray-800 */
    }

    ::-webkit-scrollbar-thumb {
      background: #4b5563;
      /* bg-gray-600 */
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #6b7280;
      /* bg-gray-500 */
    }

    #map-container {
      height: 100%;
      width: 100%;
      background-color: #374151;
      /* bg-gray-700 for map background before tiles load */
    }

    .picc-label {
      background-color: rgba(0, 0, 0, 0.6);
      color: white;
      padding: 2px 5px;
      border-radius: 3px;
      font-size: 10px;
      font-weight: bold;
      text-align: center;
      border: 1px solid white;
      /* Added border for better visibility */
      white-space: nowrap;
    }
  </style>
  <link rel="stylesheet" href="/index.css">
</head>

<body class="bg-gray-900 antialiased">
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
