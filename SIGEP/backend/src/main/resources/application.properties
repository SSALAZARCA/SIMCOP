server.port=${PORT:${SERVER_PORT:4000}}

# H2 Database Configuration (Multi-process concurrency enabled)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/sigep-db;AUTO_SERVER=TRUE}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:password}
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Enable H2 console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT Security Configuration
sigep.jwt.secret=${SIGEP_JWT_SECRET:${JWT_SECRET:SigepSecretKeyForMilitaryPersonnelManagementVerySecureKey20261234567890}}
sigep.jwt.expiration=${SIGEP_JWT_EXPIRATION:86400000}

# CORS Allowed Origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:80,http://localhost:8080,http://localhost:8085,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:8080,http://127.0.0.1:8085}
sigep.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:80,http://localhost:8080,http://localhost:8085,http://127.0.0.1:3000,http://127.0.0.1:5173,http://127.0.0.1:8080,http://127.0.0.1:8085}

# SIMCOP Interoperability Configuration
simcop.api.url=${SIMCOP_API_URL:http://localhost:8085/api}
simcop.service.token=${SIMCOP_SERVICE_TOKEN:simcop-tactical-m2m-secure-token-2026}
simcop.client.connect-timeout=5000
simcop.client.read-timeout=5000

