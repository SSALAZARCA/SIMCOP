
spring.application.name=simcop-backend

# Database Configuration
# Si SPRING_DATASOURCE_URL está presente (ej. en Docker/Producción), se usará MySQL. 
# De lo contrario, cae a H2 para desarrollo local sin dependencias.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:simcop;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}

# Flyway - Se activa automáticamente si no es H2
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
# Condicional para Flyway en H2 (opcionalmente desactivar si es H2 mem)
# spring.flyway.clean-disabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true
spring.flyway.clean-on-validation-error=true
spring.flyway.clean-disabled=false

# Server
server.port=8080

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# OpenWeatherMap Integration
openweather.api.key=${OPENWEATHER_API_KEY}
openweather.api.url=https://api.openweathermap.org/data/2.5/weather
telegram.bot.token=

# File Upload Configuration
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB