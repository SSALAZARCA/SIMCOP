
spring.application.name=simcop-backend

# Database Configuration
# Spring Boot autodetectará el driver y el dialecto basándose en la URL.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:simcop;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
# El dialecto también se autodetecta, pero permitimos override si es necesario
# spring.jpa.properties.hibernate.dialect=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}

# Flyway
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:true}
# Condicional para Flyway en H2 (opcionalmente desactivar si es H2 mem)
# spring.flyway.clean-disabled=false
spring.flyway.baseline-on-migrate=true
spring.flyway.repair-on-migrate=true
spring.flyway.clean-on-validation-error=true
spring.flyway.clean-disabled=false

# Server
server.port=8080

# JWT Configuration
jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
jwt.expiration=86400000

# OpenWeatherMap Integration
openweather.api.key=${OPENWEATHER_API_KEY}
openweather.api.url=https://api.openweathermap.org/data/2.5/weather
telegram.bot.token=

# File Upload Configuration
file.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB