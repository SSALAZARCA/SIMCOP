version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:mysql://mysql:3306/simcop?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false}
      - SPRING_DATASOURCE_USERNAME=${DATABASE_USER:-root}
      - SPRING_DATASOURCE_PASSWORD=${DATABASE_PASSWORD:-password}
      - SPRING_DATASOURCE_DRIVER=${SPRING_DATASOURCE_DRIVER:-com.mysql.cj.jdbc.Driver}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=${SPRING_JPA_HIBERNATE_DDL_AUTO:-update}
      - SPRING_JPA_DIALECT=${SPRING_JPA_DIALECT:-org.hibernate.dialect.MySQL8Dialect}
      - SPRING_FLYWAY_ENABLED=${SPRING_FLYWAY_ENABLED:-true}
      - JWT_SECRET=${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      - OPENWEATHER_API_KEY=${OPENWEATHER_API_KEY}
    ports:
      - "5005:8080"
    depends_on:
      - mysql
    networks:
      - coolify
      - simcop_internal

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_BASE_URL=${VITE_API_BASE_URL:-https://api.simcop.site}
    ports:
      - "5006:80"
    depends_on:
      - backend
    networks:
      - coolify
      - simcop_internal

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=simcop
      - MYSQL_ROOT_PASSWORD=${DATABASE_PASSWORD:-password}
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "5007:3306"
    networks:
      - simcop_internal

networks:
  coolify:
    external: true
  simcop_internal:
    driver: bridge

volumes:
  mysql_data:

