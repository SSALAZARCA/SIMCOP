server {
    listen 80;
    server_name _;
    
    # Security Audit: Hide Nginx version
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), microphone=(self)" always;
    
    # CSP Configuration
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://* wss://*; img-src 'self' data: blob: https://*; style-src 'self' 'unsafe-inline' https://*; font-src 'self' data: https://*; script-src 'self' 'unsafe-eval' 'unsafe-inline'; worker-src 'self' blob:;" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Static assets cache control
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Restrict sensitive files (SPA fallback should not handle these)
    location ~* (\.env|\.git|robots\.txt|sitemap\.xml|\.map)$ {
        return 404;
    }

    # SPA Fallback logic
    location / {
        try_files $uri $uri/ /index.html;
    }
}
