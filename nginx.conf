server {
    listen 80;
    server_name _;
    
    # Security Audit: Hide Nginx version
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Docker internal DNS resolver (resolves service names like 'backend', 'mysql')
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 10s;

    # Custom 502 error page for backend unavailability diagnostics
    error_page 502 /502.json;
    location = /502.json {
        internal;
        default_type application/json;
        return 502 '{"error":"backend_unavailable","message":"El backend Spring Boot no responde. Puede estar iniciando (espere 2-3 min) o haber crasheado. Revise los logs del contenedor backend en Coolify."}';
    }

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
    
    # CSP Configuration for Cesium 3D, Web Workers, ArcGIS, ESRI, CartoDB, OSM, RainViewer, Windy, Google Fonts and SIMCOP APIs
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.simcop.site wss://api.simcop.site https://elevation3d.arcgis.com https://*.arcgis.com https://*.arcgisonline.com https://services.arcgisonline.com https://*.cartocdn.com https://*.openstreetmap.org https://nominatim.openstreetmap.org https://tilecache.rainviewer.com https://*.tilecache.rainviewer.com https://api.rainviewer.com https://*.cesium.com https://mapas.igac.gov.co https://api.omniroute.ai https://*.sslip.io https://*.nip.io https://generativelanguage.googleapis.com https://api.bigdatacloud.net https://api.open-elevation.com https://api.telegram.org http://localhost:* http://127.0.0.1:*; img-src 'self' data: blob: https://*.arcgis.com https://*.arcgisonline.com https://services.arcgisonline.com https://*.cartocdn.com https://*.openstreetmap.org https://tilecache.rainviewer.com https://*.tilecache.rainviewer.com https://*.cesium.com https://media.giphy.com https://www.transparenttextures.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; script-src 'self' 'unsafe-eval' 'unsafe-inline' blob:; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' https://embed.windy.com; object-src 'none'; base-uri 'self';" always;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Static assets cache control
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        
        # Security Headers (duplicated)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.simcop.site wss://api.simcop.site https://elevation3d.arcgis.com https://*.arcgis.com https://*.arcgisonline.com https://services.arcgisonline.com https://*.cartocdn.com https://*.openstreetmap.org https://nominatim.openstreetmap.org https://tilecache.rainviewer.com https://*.tilecache.rainviewer.com https://api.rainviewer.com https://*.cesium.com https://mapas.igac.gov.co https://api.omniroute.ai https://*.sslip.io https://*.nip.io https://generativelanguage.googleapis.com https://api.bigdatacloud.net https://api.open-elevation.com https://api.telegram.org http://localhost:* http://127.0.0.1:*; img-src 'self' data: blob: https://*.arcgis.com https://*.arcgisonline.com https://services.arcgisonline.com https://*.cartocdn.com https://*.openstreetmap.org https://tilecache.rainviewer.com https://*.tilecache.rainviewer.com https://*.cesium.com https://media.giphy.com https://www.transparenttextures.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; script-src 'self' 'unsafe-eval' 'unsafe-inline' blob:; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' https://embed.windy.com; object-src 'none'; base-uri 'self';" always;

        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Restrict sensitive files (SPA fallback should not handle these)
    location ~* (/\.env|/\.git|/robots\.txt|/sitemap\.xml|.*\.map|/package\.json|/\.well-known) {
        return 404;
    }

    # AI API Reverse Proxy
    location /ai_api/ {
        set $upstream_ai http://ai_engine:8000;
        proxy_pass $upstream_ai/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend Spring Boot API Reverse Proxy
    location /api/ {
        set $upstream_backend http://backend:8080;
        proxy_pass $upstream_backend/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # WebSocket Reverse Proxy
    location /ws {
        set $upstream_ws http://backend:8080;
        proxy_pass $upstream_ws/ws;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # SPA Fallback logic
    location / {
        try_files $uri $uri/ /index.html;
        
        # Security Headers (duplicated because add_header in location block overrides server block)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=()" always;
        add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.simcop.site wss://api.simcop.site https://elevation3d.arcgis.com https://*.arcgis.com https://*.arcgisonline.com https://services.arcgisonline.com https://*.cartocdn.com https://*.openstreetmap.org https://nominatim.openstreetmap.org https://tilecache.rainviewer.com https://*.tilecache.rainviewer.com https://api.rainviewer.com https://*.cesium.com https://mapas.igac.gov.co https://api.omniroute.ai https://*.sslip.io https://*.nip.io https://generativelanguage.googleapis.com https://api.bigdatacloud.net https://api.open-elevation.com https://api.telegram.org http://localhost:* http://127.0.0.1:*; img-src 'self' data: blob: https://*.arcgis.com https://*.arcgisonline.com https://services.arcgisonline.com https://*.cartocdn.com https://*.openstreetmap.org https://tilecache.rainviewer.com https://*.tilecache.rainviewer.com https://*.cesium.com https://media.giphy.com https://www.transparenttextures.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; script-src 'self' 'unsafe-eval' 'unsafe-inline' blob:; worker-src 'self' blob:; child-src 'self' blob:; frame-src 'self' https://embed.windy.com; object-src 'none'; base-uri 'self';" always;
        
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}
