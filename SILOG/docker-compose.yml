version: '3.8'

# ============================================================================
# DOCKER COMPOSE PRODUCCIÓN - SILOGA (https://siloga.site)
# Despliegue listo para VPS (Ubuntu / Debian / Coolify / Portainer)
# ============================================================================

services:
  siloga:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: siloga_production
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DOMAIN=siloga.site
      - JWT_SECRET=${JWT_SECRET:-siloga-military-defense-jwt-secret-key-2026-superadmin-omega}
      - SIMCOP_SUPERADMIN_PASSWORD=${SIMCOP_SUPERADMIN_PASSWORD:-ssc841209}
    volumes:
      # Persistencia en el disco del host VPS para inventarios y registros
      - ./backend/data:/app/backend/data
    networks:
      - siloga_net

networks:
  siloga_net:
    driver: bridge
